<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kopilot – priprava na teoretični izpit SPL, PPL in radiotelefonijo.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kopilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kopilot</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Navodilo za iOS: predstavitvena stran odpre aplikacijo z ?namesti=ios.
       iOS nima gumba za namestitev, zato pokažemo, kje je »Dodaj na začetni zaslon«. -->
  <div id="ios-hint" hidden>
    <span>Za namestitev tapni <b>Deli</b> <svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true"><path d="M8 1v11M4 5l4-4 4 4M2 9v8h12V9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      in nato <b>Dodaj na začetni zaslon</b>.</span>
    <button id="ios-hint-close" type="button" aria-label="Zapri">✕</button>
  </div>
  <style>
    #ios-hint { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 9998;
      display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px;
      background: #FFC72C; color: #0E2A5C; font: 500 15px/1.4 system-ui, -apple-system, sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,.25); }
    #ios-hint[hidden] { display: none; }
    #ios-hint svg { vertical-align: -3px; }
    #ios-hint-close { margin-left: auto; border: 0; background: transparent; color: inherit;
      font-size: 18px; padding: 4px 6px; }
  </style>
  <script>
    (function () {
      var standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      if (!standalone && /[?&]namesti=ios\b/.test(location.search)) {
        var hint = document.getElementById('ios-hint');
        hint.hidden = false;
        document.getElementById('ios-hint-close').onclick = function () { hint.hidden = true; };
      }
    })();
  </script>

  <!-- PWA: service worker (tools/build_pwa.py) in obvestilo o novi različici. -->
  <div id="update-banner" hidden>
    <span>Na voljo je nova različica.</span>
    <button id="update-btn" type="button">Osveži</button>
  </div>
  <style>
    #update-banner { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 9999;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border-radius: 14px; background: #0E2A5C; color: #fff;
      font: 600 15px/1.4 system-ui, -apple-system, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
    #update-banner[hidden] { display: none; }
    #update-btn { border: 0; border-radius: 10px; padding: 8px 14px; background: #FFC72C;
      color: #0E2A5C; font: inherit; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          function offer(worker) {
            document.getElementById('update-banner').hidden = false;
            document.getElementById('update-btn').onclick = function () {
              worker.postMessage('SKIP_WAITING');
            };
          }
          if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            w.addEventListener('statechange', function () {
              if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w);
            });
          });
          // Nameščena aplikacija (posebej na iOS) se pogosto samo vrne iz ozadja:
          // takrat preverimo, ali je na strežniku nova različica.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update();
          });
        });
        // Ponovno naložimo samo, ko nova različica zamenja staro – ne ob prvi namestitvi.
        var hadController = !!navigator.serviceWorker.controller;
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) { hadController = true; return; }
          if (!reloading) { reloading = true; window.location.reload(); }
        });
      });
    }
  </script>
</body>
</html>
